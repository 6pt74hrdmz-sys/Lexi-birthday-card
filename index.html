<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lexi Birthday Memories</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block}
#start{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 30px;border:2px solid #fff;border-radius:999px;background:#fff;color:#111;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 15px 60px #0009}
#start:disabled{opacity:.7;cursor:wait}
#status{position:fixed;z-index:100;left:20px;bottom:20px;padding:10px 14px;border:1px solid #fff3;border-radius:999px;background:#0009;font-size:13px}
#debug{position:fixed;z-index:110;left:20px;right:20px;top:90px;max-width:760px;padding:12px;border-radius:12px;background:#17090d;color:#ffd9df;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;display:none;white-space:pre-wrap}
#video{position:fixed;z-index:10;right:18px;top:18px;width:170px;border-radius:14px;transform:scaleX(-1);opacity:.55;display:none}
#title{position:fixed;z-index:5;left:22px;top:18px;font-size:28px;font-weight:700}
.sub{font-size:15px;font-weight:400;opacity:.6;margin-top:4px}
#birthdayText{position:fixed;z-index:5;left:50%;top:72%;transform:translateX(-50%);font-size:28px;font-weight:700;letter-spacing:.2px;text-align:center;white-space:nowrap;text-shadow:0 4px 24px #000b}
#hint{position:fixed;z-index:5;right:20px;bottom:20px;text-align:right;font-size:13px;line-height:1.7;opacity:.65}
#card{position:fixed;z-index:20;left:50%;top:50%;width:min(46vw,390px);padding:12px;background:#fff;color:#222;opacity:0;transform:translate(-50%,-50%) scale(.75);transition:.7s;box-shadow:0 25px 60px #0009;pointer-events:none}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#photo{width:100%;max-height:60vh;object-fit:cover;display:block}
</style>
</head>
<body>
<button id="start" type="button" onclick="startApp()">Enable camera &amp; start ✨</button>
<div id="title">✨ Birthday Memories<div class="sub">3D particle cake · gesture controlled</div></div>
<div id="birthdayText">Lexi Happy Birthday</div>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready</div>
<div id="debug"></div>
<div id="hint">✊ Fist · birthday cake<br>🖐️ Open hand · scatter<br>🤏 Pinch · next photo</div>
<div id="card"><img id="photo" alt="Birthday memory"></div>
<script>
const startButton=document.getElementById("start"),statusEl=document.getElementById("status"),debugEl=document.getElementById("debug"),video=document.getElementById("video"),card=document.getElementById("card"),photo=document.getElementById("photo");
const photos=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg","photo6.jpg","photo7.jpg","photo8.jpg"];
let stream=null,handLandmarker=null,started=false,photoIndex=-1,wasPinching=false;
function setStatus(text){statusEl.textContent=text;console.log("[Birthday V6]",text)}
function showError(err){const message=err&&(err.message||String(err))||"Unknown error";debugEl.style.display="block";debugEl.textContent="V6 ERROR\n\n"+message+"\n\nIf you see this, the page is running and the button works.";setStatus("⚠️ "+message);startButton.disabled=false;startButton.textContent="Try again"}
async function startApp(){if(started)return;startButton.disabled=true;startButton.textContent="Requesting camera…";setStatus("1/3 Requesting camera permission…");debugEl.style.display="none";try{if(!window.isSecureContext)throw new Error("This page is not using HTTPS. Open the github.io address.");if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("This browser does not expose the camera API.");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;video.style.display="block";await video.play();setStatus("2/3 CAMERA ON ✓ Loading 3D…");startButton.style.display="none";await loadScript("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js");await initThree();setStatus("3/3 Camera ON ✓ Loading hand tracking…");const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm");window.vision=vision;await initHands()}catch(err){console.error(err);showError(err)}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error("Could not load external library: "+src));document.head.appendChild(s)})}
async function initThree(){const THREE=window.THREE;if(!THREE)throw new Error("Three.js loaded incorrectly.");const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.z=8;const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const N=8500,geometry=new THREE.BufferGeometry(),positions=new Float32Array(N*3),target=new Float32Array(N*3),points=[];const add=(x,y,z)=>points.push(x,y,z);for(let layer=0;layer<3;layer++){const r=1.65-layer*.2,y=-1.15+layer*.7;for(let i=0;i<1700;i++){const q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*r;add(Math.cos(q)*rr,y+(Math.random()-.5)*.55,Math.sin(q)*rr)}}for(let i=0;i<1000;i++){const q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*1.5;add(Math.cos(q)*rr,.85+Math.random()*.2,Math.sin(q)*rr)}for(let c=0;c<5;c++){const x=(c-2)*.52;for(let i=0;i<260;i++){const q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*.09;add(x+Math.cos(q)*rr,1.05+Math.random()*.9,Math.sin(q)*rr)}}while(points.length<N*3){const q=Math.random()*Math.PI*2,r=1.3+Math.random()*.3;add(Math.cos(q)*r,.95+Math.random()*.1,Math.sin(q)*r)}for(let i=0;i<N;i++){positions[i*3]=(Math.random()-.5)*7;positions[i*3+1]=(Math.random()-.5)*5;positions[i*3+2]=(Math.random()-.5)*7;target[i*3]=points[i*3];target[i*3+1]=points[i*3+1];target[i*3+2]=points[i*3+2]}geometry.setAttribute("position",new THREE.BufferAttribute(positions,3));const material=new THREE.PointsMaterial({size:.035,color:0xffd7ed,transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false}),particles=new THREE.Points(geometry,material);scene.add(particles);let gather=.15,hx=0,hy=0;window.__particleControl=(g,x,y)=>{gather=g;hx=x;hy=y};function loop(){requestAnimationFrame(loop);for(let i=0;i<N;i++){const k=i*3,spread=1-gather,sx=Math.cos(i*12.9)*3*spread+hx*spread*.4,sy=Math.sin(i*78.2)*2.5*spread+hy*spread*.3,sz=Math.sin(i*39.4)*3*spread;positions[k]+=((target[k]*gather+sx)-positions[k])*.055;positions[k+1]+=((target[k+1]*gather+sy)-positions[k+1])*.055;positions[k+2]+=((target[k+2]*gather+sz)-positions[k+2])*.055}geometry.attributes.position.needsUpdate=true;particles.rotation.y+=.001;renderer.render(scene,camera)}loop();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
async function initHands(){if(!window.vision)throw new Error("MediaPipe vision library did not load.");const{FilesetResolver,HandLandmarker}=window.vision,fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm");handLandmarker=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"CPU"},runningMode:"VIDEO",numHands:1});setStatus("READY ✓ Camera ON · Show your hand");started=true;detect()}
function nextPhoto(){photoIndex=(photoIndex+1)%photos.length;photo.src=photos[photoIndex];card.classList.add("show")}
function hidePhoto(){card.classList.remove("show")}
function detect(){if(!handLandmarker){requestAnimationFrame(detect);return}try{const result=handLandmarker.detectForVideo(video,performance.now());if(result.landmarks&&result.landmarks.length){const lm=result.landmarks[0],wrist=lm[0],index=lm[8],thumb=lm[4],hx=(.5-index.x)*4.5,hy=(index.y-.5)*3.8,pinch=Math.hypot(index.x-thumb.x,index.y-thumb.y),isPinching=pinch<.055,tips=[8,12,16,20],avg=tips.reduce((sum,k)=>sum+Math.hypot(lm[k].x-wrist.x,lm[k].y-wrist.y),0)/4;if(isPinching){window.__particleControl?.(.25,hx,hy);if(!wasPinching){nextPhoto()}statusEl.textContent="🤏 Pinch · next memory"}else if(avg<.24){window.__particleControl?.(1,hx,hy);statusEl.textContent="✊ Fist · birthday cake"}else{window.__particleControl?.(.06,hx,hy);statusEl.textContent="🖐️ Open hand · scatter"}wasPinching=isPinching}else{wasPinching=false}}catch(err){showError(err);return}requestAnimationFrame(detect)}
window.addEventListener("error",e=>console.error("Window error:",e.error||e.message));window.addEventListener("unhandledrejection",e=>console.error("Unhandled rejection:",e.reason));
</script>
</body>
</html>
