<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexi Birthday Card</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}#start{position:fixed;z-index:99;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 25px;border:0;border-radius:999px;background:#fff;color:#111;font-size:16px;cursor:pointer;box-shadow:0 15px 60px #0008}
#status{position:fixed;z-index:20;left:20px;bottom:20px;padding:10px 14px;border:1px solid #fff3;border-radius:999px;background:#0008;font-size:13px}
#debug{position:fixed;z-index:30;left:20px;top:70px;max-width:520px;padding:10px;border-radius:10px;background:#000b;color:#ddd;font:12px/1.5 monospace;display:none}
#video{position:fixed;z-index:10;right:18px;top:18px;width:150px;border-radius:14px;transform:scaleX(-1);opacity:.35}
#title{position:fixed;z-index:5;left:20px;top:20px;font-size:21px}.sub{font-size:11px;opacity:.55;margin-top:4px}
#hint{position:fixed;z-index:5;right:20px;bottom:20px;text-align:right;font-size:12px;line-height:1.7;opacity:.6}
#card{position:fixed;z-index:8;left:50%;top:50%;width:min(46vw,390px);padding:12px 12px 36px;background:#fff;color:#222;opacity:0;transform:translate(-50%,-50%) scale(.75);transition:.7s;box-shadow:0 25px 60px #0009}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#photo{width:100%;max-height:60vh;object-fit:cover;display:block}.caption{text-align:center;margin-top:8px;font-family:cursive;font-size:18px}
</style>
</head>
<body>
<button id="start">Enable camera & start ✨</button>
<div id="title">✨ Birthday Memories<div class="sub">3D particle cake · gesture controlled</div></div>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready — click the button</div><div id="debug"></div>
<div id="hint">✊ 握拳 · 蛋糕<br>🖐️ 张开 · 粒子散开<br>🤏 捏合 · 下一张照片</div>
<div id="card"><img id="photo"><div class="caption" id="caption"></div></div>

<script>
/* V4 deliberately binds the button BEFORE loading any external library. */
const start=document.getElementById('start'), status=document.getElementById('status'), debug=document.getElementById('debug'), video=document.getElementById('video');
const card=document.getElementById('card'), photo=document.getElementById('photo'), caption=document.getElementById('caption');
const photos=["photos/photo1.JPG","photos/photo2.JPG","photos/photo3.JPG","photos/photo4.jpg","photos/photo5.jpg","photos/photo6.jpg","photos/photo7.jpg","photos/photo8.jpg"];
let stream=null, hand=null, started=false, photoIndex=-1, lastPinch=0;

function setStatus(s){status.textContent=s;console.log(s)}
function error(e){debug.style.display='block';debug.textContent='ERROR\\n'+(e?.stack||e?.message||e);status.textContent='⚠️ '+(e?.message||'Something failed');start.disabled=false;start.textContent='Try again'}

start.addEventListener('click', async ()=>{
  if(started) return;
  start.disabled=true; start.textContent='Requesting camera…';
  try{
    if(!window.isSecureContext) throw new Error('Not HTTPS. Open the github.io address.');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera API is unavailable.');
    setStatus('1/3 Requesting camera permission…');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream; await video.play();
    video.style.opacity='.55';
    setStatus('2/3 CAMERA ON ✓ Loading 3D + hand tracking…');
    start.style.display='none';
    await loadScripts();
  }catch(e){error(e)}
});

async function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));document.head.appendChild(s)
  })
}
async function loadScripts(){
  // Load MediaPipe and Three.js after camera is already proven to work.
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js');
  setStatus('3/3 Camera ON ✓ Libraries loaded');
  await initThree();
  await initHands();
}

async function initThree(){
  const THREE=window.THREE;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);cam.position.z=8;
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
  const N=8500, geo=new THREE.BufferGeometry(), a=new Float32Array(N*3), t=new Float32Array(N*3), pts=[];
  const add=(x,y,z)=>pts.push(x,y,z);
  for(let l=0;l<3;l++){let r=1.65-l*.2,y=-1.15+l*.7;for(let i=0;i<1700;i++){let q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*r;add(Math.cos(q)*rr,y+(Math.random()-.5)*.55,Math.sin(q)*rr)}}
  for(let i=0;i<1000;i++){let q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*1.5;add(Math.cos(q)*rr,.85+Math.random()*.2,Math.sin(q)*rr)}
  for(let c=0;c<5;c++){let x=(c-2)*.52;for(let i=0;i<260;i++){let q=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*.09;add(x+Math.cos(q)*rr,1.05+Math.random()*.9,Math.sin(q)*rr)}}
  while(pts.length<N*3){let q=Math.random()*Math.PI*2,r=1.3+Math.random()*.3;add(Math.cos(q)*r,.95+Math.random()*.1,Math.sin(q)*r)}
  for(let i=0;i<N;i++){a[i*3]=(Math.random()-.5)*7;a[i*3+1]=(Math.random()-.5)*5;a[i*3+2]=(Math.random()-.5)*7;t[i*3]=pts[i*3];t[i*3+1]=pts[i*3+1];t[i*3+2]=pts[i*3+2]}
  geo.setAttribute('position',new THREE.BufferAttribute(a,3));
  const p=new THREE.Points(geo,new THREE.PointsMaterial({size:.035,color:0xffd7ed,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(p);
  let gather=.15,hx=0,hy=0;
  window.__particleControl=(g,x,y)=>{gather=g;hx=x;hy=y};
  function loop(){requestAnimationFrame(loop);for(let i=0;i<N;i++){let k=i*3,s=1-gather,sx=Math.cos(i*12.9)*3*s+hx*s*.4,sy=Math.sin(i*78.2)*2.5*s+hy*s*.3,sz=Math.sin(i*39.4)*3*s;a[k]+=((t[k]*gather+sx)-a[k])*.055;a[k+1]+=((t[k+1]*gather+sy)-a[k+1])*.055;a[k+2]+=((t[k+2]*gather+sz)-a[k+2])*.055}geo.attributes.position.needsUpdate=true;p.rotation.y+=.001;renderer.render(scene,cam)}
  loop();
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
}
async function initHands(){
  const {FilesetResolver,HandLandmarker}=window.vision;
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
  hand=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});
  setStatus('READY ✓ Camera ON · Show your hand');
  started=true; debug.style.display='none'; detect();
}
function nextPhoto(){photoIndex=(photoIndex+1)%photos.length;photo.src=photos[photoIndex];caption.textContent='memory '+String(photoIndex+1).padStart(2,'0')+' ✨';card.classList.add('show')}
function hidePhoto(){card.classList.remove('show')}
function detect(){
  const r=hand.detectForVideo(video,performance.now());
  if(r.landmarks?.length){
    const lm=r.landmarks[0],w=lm[0],i=lm[8],th=lm[4];
    const hx=(.5-i.x)*4.5,hy=(i.y-.5)*3.8,pinch=Math.hypot(i.x-th.x,i.y-th.y);
    const tips=[8,12,16,20],avg=tips.reduce((s,k)=>s+Math.hypot(lm[k].x-w.x,lm[k].y-w.y),0)/4;
    if(pinch<.055){window.__particleControl?.(.25,hx,hy);if(performance.now()-lastPinch>1000){nextPhoto();lastPinch=performance.now()}status.textContent='🤏 Pinch · next memory'}
    else if(avg<.24){window.__particleControl?.(1,hx,hy);hidePhoto();status.textContent='✊ Fist · birthday cake'}
    else{window.__particleControl?.(.06,hx,hy);hidePhoto();status.textContent='🖐️ Open hand · scatter'}
  }
  requestAnimationFrame(detect)
}
</script>
</body>
</html>
